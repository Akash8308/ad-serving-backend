# ---------------------------------------------------------------------------
# AdServe base configuration. Secrets and hosts come from environment variables;
# nothing secret has a default here. Local defaults live in application-dev.properties.
# Keys under "adserve." are consumed by the infrastructure layer added in the next phase.
# ---------------------------------------------------------------------------
spring.application.name=adserve
server.port=${PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s

# ---- PostgreSQL (authority for campaigns, budget ledger, reservations, outbox, stats) ----
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:20}
spring.datasource.hikari.connection-timeout=250
spring.datasource.hikari.validation-timeout=250

# Schema is owned by Flyway; Hibernate only validates it.
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# ---- Redis (candidate cache only; never an authority) ----
spring.data.redis.host=${REDIS_HOST}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=30ms
spring.data.redis.connect-timeout=100ms

# ---- Kafka (tracking events) ----
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS}
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
spring.kafka.producer.properties.max.block.ms=300
spring.kafka.consumer.group-id=adserve-analytics
spring.kafka.consumer.enable-auto-commit=false
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.listener.ack-mode=record

# ---- Time: everything is UTC (assumption A3) ----
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false

# ---- Actuator: health and metrics (FR-D5) ----
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=when-authorized

# ---------------------------------------------------------------------------
# AdServe business and resilience settings (design sections 6-9)
# ---------------------------------------------------------------------------
# Reservation TTL = attribution window (assumption A4). Shorter frees funds sooner but rejects later clicks.
adserve.budget.reservation-ttl=10m
adserve.budget.expiry-sweep-interval=30s
adserve.budget.expiry-sweep-batch-size=1000

# Serving path: bounded work per request (6.1) and per-dependency timeouts (6.4)
adserve.serving.max-reservation-attempts=3
adserve.serving.candidate-cache-ttl=30s
adserve.serving.redis-timeout=30ms
adserve.serving.db-timeout=200ms
adserve.serving.db-fallback-max-concurrency=10

# Tracking token signing (9.1). Keys are base64, at least 32 bytes decoded. Provide via environment.
adserve.tracking.signing-key-id=${ADSERVE_TOKEN_KEY_ID:k1}
adserve.tracking.keys.k1=${ADSERVE_TOKEN_KEY_K1}

# Kafka tracking pipeline (9.4, 9.5)
adserve.events.topic=tracking.v1
adserve.events.dead-letter-topic=tracking.v1.dlt
adserve.events.impression-publish-timeout=300ms
adserve.events.outbox-poll-interval=200ms
adserve.events.outbox-batch-size=100
adserve.events.outbox-retention=1d
adserve.events.processed-events-retention=7d
adserve.events.consumer-max-retries=3
